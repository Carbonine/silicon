<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silicon</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem("theme");if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header id="tabbar">
    <div id="tabs" role="tablist"></div>
    <button id="new-tab" class="icon-btn" aria-label="New tab" title="New tab"><span class="ms">add</span></button>
  </header>

  <div id="toolbar">
    <button id="back" class="icon-btn" aria-label="Back" title="Back"><span class="ms">arrow_back</span></button>
    <button id="forward" class="icon-btn" aria-label="Forward" title="Forward"><span class="ms">arrow_forward</span></button>
    <button id="reload" class="icon-btn" aria-label="Reload" title="Reload"><span class="ms">refresh</span></button>
    <button id="home-btn" class="icon-btn" aria-label="Home" title="Home"><span class="ms">home</span></button>
    <form id="address-form"><span id="site-icon" class="ms">search</span><input id="address" class="address" type="text" placeholder="Search or enter web address" aria-label="Address bar" spellcheck="false" autocomplete="off"><div id="suggest" role="listbox" hidden></div></form>
    <button id="bookmark-btn" class="icon-btn" aria-label="Bookmark this page" title="Bookmark this page (Ctrl+D)" disabled><span class="ms">star</span></button>
    <button id="menu-btn" class="icon-btn" aria-label="More" aria-haspopup="menu" title="More" data-opens-menu><span class="ms">more_vert</span></button>
    <div id="loader"></div>
  </div>

  <nav id="bookmarkbar" aria-label="Bookmarks" hidden></nav>

  <main id="stage"></main>
  <div id="findbar" role="search" hidden>
    <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page" spellcheck="false" autocomplete="off">
    <span id="find-count" aria-live="polite"></span>
    <button id="find-prev" class="icon-btn" aria-label="Previous match" title="Previous match (Shift+Enter)"><span class="ms">keyboard_arrow_up</span></button>
    <button id="find-next" class="icon-btn" aria-label="Next match" title="Next match (Enter)"><span class="ms">keyboard_arrow_down</span></button>
    <button id="find-close" class="icon-btn" aria-label="Close find" title="Close (Esc)"><span class="ms">close</span></button>
  </div>
  <div id="menu" class="menu" role="menu" hidden></div>
  <dialog id="shortcuts-dialog">
    <h2>Keyboard shortcuts</h2>
    <div id="shortcuts-body"></div>
    <p class="sc-note">On Windows and Linux, browsers often keep the Ctrl shortcuts for tabs for themselves. The Alt versions always work.</p>
    <div class="actions"><button type="button" class="cancel primary">Done</button></div>
  </dialog>
  <dialog id="bm-edit">
    <form method="dialog">
      <h2>Edit bookmark</h2>
      <label>Name <input name="name" type="text" autocomplete="off"></label>
      <label>URL <input name="url" type="text" autocomplete="off" spellcheck="false"></label>
      <p class="error"></p>
      <div class="actions"><button type="button" class="cancel">Cancel</button><button type="submit" class="primary">Save</button></div>
    </form>
  </dialog>
  <p id="status" class="status" hidden></p>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
